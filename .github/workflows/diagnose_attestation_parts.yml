name: Diagnose attestation payload parts

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Inspect payload
        shell: bash
        run: |
          set -u
          source_dir="attestation_stage_1_verified_2026_08_03"
          ls -la "$source_dir"
          wc -c "$source_dir"/part-*.txt
          cat "$source_dir"/part-*.txt | tr -d '\r\n' > /tmp/payload.b64
          echo "base64_chars=$(wc -c < /tmp/payload.b64)"
          base64 --decode /tmp/payload.b64 > /tmp/payload.xz
          echo "xz_bytes=$(wc -c < /tmp/payload.xz)"
          xz --list --verbose /tmp/payload.xz || true
          printf 'base64_tail='; tail -c 80 /tmp/payload.b64; echo
